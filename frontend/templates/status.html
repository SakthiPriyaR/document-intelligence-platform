<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Ledger | Service status</title>
    <style>
      :root { color-scheme: light; --ink: #102c32; --teal: #0f766e; --mint: #eaf7f3; --paper: #f6f4ee; --line: #d6e1de; --muted: #66767a; --red: #b5473a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 85% 0%, #dff4ed, transparent 34rem), var(--paper); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(760px, calc(100% - 2rem)); margin: 0 auto; padding: 4.5rem 0 3rem; }
      .brand { display: flex; align-items: center; gap: .7rem; font-family: Georgia, serif; font-size: 1.35rem; font-weight: 700; }
      .mark { color: var(--teal); font-size: 2.1rem; line-height: 1; }
      .eyebrow { margin: 3.5rem 0 .6rem; color: var(--teal); font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(2.3rem, 7vw, 4.3rem); letter-spacing: -.045em; line-height: 1; }
      .intro { max-width: 580px; margin: 1.15rem 0 2rem; color: var(--muted); font-size: 1.08rem; line-height: 1.65; }
      .panel { border: 1px solid var(--line); border-radius: 24px; overflow: hidden; background: rgba(255,255,255,.84); box-shadow: 0 18px 45px rgba(28, 67, 63, .09); }
      .hero { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.6rem; border-bottom: 1px solid var(--line); }
      .label { color: var(--muted); font-size: .73rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      .state { display: flex; align-items: center; gap: .6rem; margin-top: .5rem; font-size: 1.35rem; font-weight: 750; }
      .dot { width: .7rem; height: .7rem; border-radius: 50%; background: #22a06b; box-shadow: 0 0 0 .35rem #e5f7ef; }
      .dot.warn { background: #d97706; box-shadow: 0 0 0 .35rem #fff4df; }
      .checks { display: grid; grid-template-columns: repeat(3, 1fr); }
      .check { min-height: 122px; padding: 1.25rem 1.45rem; border-right: 1px solid var(--line); }
      .check:last-child { border-right: 0; }
      .check span { display: block; color: var(--muted); font-size: .76rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
      .check strong { display: block; margin-top: .5rem; color: var(--teal); font-size: 1.05rem; }
      .meta { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; padding: 1.2rem 1.6rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
      .meta b { color: var(--ink); }
      .links { display: flex; gap: .75rem; margin-top: 1.35rem; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .7rem 1rem; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: #fff; font-weight: 700; text-decoration: none; }
      a.primary { border-color: var(--teal); color: #fff; background: var(--teal); }
      .error { color: var(--red); }
      @media (max-width: 620px) { main { padding-top: 2.2rem; } .hero { align-items: flex-start; flex-direction: column; } .checks { grid-template-columns: 1fr; } .check { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); } .check:last-child { border-bottom: 0; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark">§</span><span>Ledger</span></div>
      <p class="eyebrow">Document Intelligence Platform</p>
      <h1>Service status</h1>
      <p class="intro">A browser-friendly view of the live application health checks.</p>
      <section class="panel" aria-live="polite">
        <div class="hero">
          <div><div class="label">Current service state</div><div class="state"><i class="dot" id="dot"></i><span id="state">Checking service...</span></div></div>
          <div class="label" id="timestamp">Loading</div>
        </div>
        <div class="checks">
          <div class="check"><span>API</span><strong id="api">Checking</strong></div>
          <div class="check"><span>Database</span><strong id="database">Checking</strong></div>
          <div class="check"><span>Document processing</span><strong id="processing">Checking</strong></div>
        </div>
        <div class="meta"><span>Service: <b id="service">—</b></span><span>Version: <b id="version">—</b></span><span>Environment: <b id="environment">—</b></span></div>
      </section>
      <div class="links"><a class="primary" href="/">Open Ledger</a><a href="/docs">API documentation</a></div>
    </main>
    <script>
      const setText = (id, value) => document.getElementById(id).textContent = value;
      fetch('/api/v1/health').then(async response => {
        if (!response.ok) throw new Error('Health check unavailable');
        return response.json();
      }).then(data => {
        const healthy = data.status === 'ok';
        setText('state', healthy ? 'All systems operational' : 'Service needs attention');
        if (!healthy) document.getElementById('dot').classList.add('warn');
        setText('api', data.checks.api);
        setText('database', data.checks.database);
        setText('processing', data.checks.document_processing.replaceAll('_', ' '));
        setText('service', data.service);
        setText('version', data.version);
        setText('environment', data.environment);
        setText('timestamp', 'Checked ' + new Date(data.timestamp).toLocaleString());
      }).catch(() => {
        setText('state', 'Health check unavailable');
        document.getElementById('dot').classList.add('warn');
        setText('api', 'unavailable');
        setText('database', 'unknown');
        setText('processing', 'unknown');
        document.querySelector('.intro').classList.add('error');
      });
    </script>
  </body>
</html>
